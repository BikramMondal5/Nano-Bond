name: Build Android APKs

on:
  # Trigger release on version tags (e.g., v1.0.0, v2.1.3)
  push:
    tags:
      - "v*"
    branches: [main, master]
    paths:
      - "Android/app/**"
  pull_request:
    branches: [main, master]
    paths:
      - "Android/app/**"
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Android/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: "stable"
          cache: true

      - name: Create .env file
        run: |
          echo "WEB3AUTH_CLIENT_ID=${{ secrets.WEB3AUTH_CLIENT_ID }}" >> .env
          echo "WEB3AUTH_REDIRECT_URL=${{ secrets.WEB3AUTH_REDIRECT_URL }}" >> .env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env
          echo "RPC_URL=${{ secrets.RPC_URL }}" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Set version from tag or auto-generate
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
            VERSION_NAME=${GITHUB_REF#refs/tags/v}
            BUILD_NUMBER=${{ github.run_number }}
          else
            # Auto-generate date-based version for non-tag builds
            VERSION_NAME=$(date +%Y.%m.%d)
            BUILD_NUMBER=${{ github.run_number }}
          fi
          # Update pubspec.yaml with version
          sed -i "s/version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Building version: ${VERSION_NAME}+${BUILD_NUMBER}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Split APKs (arm64-v8a, armeabi-v7a, x86_64)
        run: flutter build apk --split-per-abi --release

      - name: Build Universal APK
        run: flutter build apk --release

      - name: List built APKs
        run: |
          echo "=== Split APKs (per architecture) ==="
          ls -lh build/app/outputs/flutter-apk/*.apk
          echo ""
          echo "=== APK Architectures ==="
          echo "arm64-v8a: Modern 64-bit ARM devices (most phones since 2017)"
          echo "armeabi-v7a: Older 32-bit ARM devices"
          echo "x86_64: Emulators and rare x86 devices"
          echo "app-release.apk: Universal APK (larger, works on all devices)"

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-split
          path: Android/app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-universal
          path: Android/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 📱 NanoBonds ${{ github.ref_name }}

            ### APK Downloads
            | Architecture | Description | Recommended For |
            |-------------|-------------|-----------------|
            | **arm64-v8a** | 64-bit ARM | Most modern phones (2017+) ✅ |
            | **armeabi-v7a** | 32-bit ARM | Older Android devices |
            | **x86_64** | 64-bit x86 | Emulators, Chromebooks |
            | **Universal** | All architectures | If unsure, use this |

            > 💡 **Tip**: For most users, download the **arm64-v8a** version for best performance.
          files: |
            Android/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            Android/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            Android/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            Android/app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
